name: Build All and Upload to Draft Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional draft release tag. Leave empty to use the newest draft.
        required: false
        type: string
        default: ""
      publish_after_upload:
        description: Publish the release after every build artifact uploads successfully.
        required: true
        type: boolean
        default: true

permissions: {}

jobs:
  select-draft-release:
    runs-on: ubuntu-latest
    permissions:
      # GitHub omits draft releases from listings without push access.
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Select draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(
              gh release list \
                --limit 1000 \
                --json tagName,isDraft,createdAt \
                --jq '[.[] | select(.isDraft)] | sort_by(.createdAt) | last | .tagName // ""'
            )"
          fi

          if [[ -z "$tag" ]]; then
            echo "No draft release was found."
            exit 1
          fi

          is_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "Release $tag exists but is not a draft."
            exit 1
          fi

          echo "Selected draft release $tag."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-all:
    needs: select-draft-release
    permissions:
      contents: read
    uses: ./.github/workflows/build-all.yml
    secrets: inherit

  upload-to-draft-release:
    needs: [select-draft-release, build-all]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Download bundled artifacts
        uses: actions/download-artifact@v8
        with:
          name: MiruShin-all
          path: dist

      - name: Verify draft release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.select-draft-release.outputs.tag }}
          PUBLISH_AFTER_UPLOAD: ${{ inputs.publish_after_upload }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "Release $RELEASE_TAG is no longer a draft."
            exit 1
          fi

          mapfile -t assets < <(find dist -maxdepth 1 -type f -print | sort)
          if (( ${#assets[@]} == 0 )); then
            echo "No bundled artifacts were downloaded."
            exit 1
          fi

          echo "Uploading ${#assets[@]} assets to draft release $RELEASE_TAG."
          gh release upload "$RELEASE_TAG" "${assets[@]}"

          if [[ "$PUBLISH_AFTER_UPLOAD" == "true" ]]; then
            echo "Publishing $RELEASE_TAG after the successful upload."
            gh release edit "$RELEASE_TAG" --draft=false --latest
            # Events created by GITHUB_TOKEN do not start other workflows, so
            # explicitly refresh the AltStore-compatible source after publish.
            gh workflow run altstore-source.yml --ref "$SOURCE_REF"
          fi

          {
            echo "### Draft release upload"
            echo
            echo "Uploaded ${#assets[@]} assets to \`$RELEASE_TAG\`."
            if [[ "$PUBLISH_AFTER_UPLOAD" == "true" ]]; then
              echo "Published \`$RELEASE_TAG\` after the upload completed."
              echo "Triggered the AltStore source refresh."
            else
              echo "Left \`$RELEASE_TAG\` as a draft."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
