name: One-shot iOS Swift shadowing fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ios-swift-shadowing.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fix Swift catch shadowing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ios/Runner/AppDelegate.swift')
          text = path.read_text()

          needle1 = '''  } catch {\n    mirushinWriteThumbnailError("AVFoundation thumbnail decode failed.", error, errorCapacity)'''
          replacement1 = '''  } catch let caughtError {\n    _ = caughtError\n    mirushinWriteThumbnailError("AVFoundation thumbnail decode failed.", error, errorCapacity)'''

          needle2 = '''  } catch {\n    if session.state().1 { return -20 }\n    mirushinWriteThumbnailError("AVFoundation thumbnail decode failed.", error, errorCapacity)'''
          replacement2 = '''  } catch let caughtError {\n    _ = caughtError\n    if session.state().1 { return -20 }\n    mirushinWriteThumbnailError("AVFoundation thumbnail decode failed.", error, errorCapacity)'''

          count1 = text.count(needle1)
          count2 = text.count(needle2)
          if count1 != 1 or count2 != 1:
              raise SystemExit(f'Expected shadowing sites 1+1, found {count1}+{count2}')

          text = text.replace(needle1, replacement1)
          text = text.replace(needle2, replacement2)
          path.write_text(text)
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/Runner/AppDelegate.swift
          git commit -m "fix(ios): avoid Swift catch error shadowing"
          git push origin HEAD:main
