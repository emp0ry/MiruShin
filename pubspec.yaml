name: mirushin
description: "New way to watch and discover media."
publish_to: 'none'
version: 2.5.0+48

environment:
  sdk: ^3.11.4

dependencies:
  cached_network_image: ^3.4.1
  crypto: ^3.0.7
  dio: ^5.9.2
  envied: ^1.3.5
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  flutter_file_dialog: ^3.0.3
  # Used only for the Cloudflare challenge solver: unlike webview_flutter it can
  # read HttpOnly cookies (cf_clearance) and covers Android/iOS/macOS/Windows.
  # The stable Windows backend (0.6.0) cannot read WebView2 cookies and can
  # access a disposed WebView environment during shutdown. 6.2.0-beta.3 ships
  # the upstream fixes for both Windows-only failures.
  flutter_inappwebview: ^6.2.0-beta.3
  flutter_js: ^0.8.7
  flutter_local_notifications: ^21.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  # Watch-party synchronized playback: P2P sync over WebRTC DataChannel, with QR
  # code pairing (generate + scan) as a fallback to manual room codes.
  # Keep this aligned with windows/runner/flutter_webrtc_plugin_lifetime_fix.cc.
  # The Windows entrypoint is rebuilt locally to release Flutter channels while
  # the engine and its HWND task runner are still alive.
  flutter_webrtc: 1.6.0
  fvp: ^0.36.2
  go_router: ^17.2.2
  intl: ^0.20.2
  media_kit: ^1.2.6
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_ios_video: ^1.1.4
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_windows_video: ^1.0.11
  media_kit_video: ^2.0.1
  mobile_scanner: ^7.1.2
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  share_plus: ^12.0.1
  shared_preferences: ^2.5.5
  shared_preferences_platform_interface: ^2.4.2
  timezone: ^0.11.0
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  wakelock_plus: ^1.5.2
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1
  webview_win_floating: ^3.0.3
  xml: ^6.6.1

dev_dependencies:
  build_runner: ^2.15.0
  envied_generator: ^1.3.5
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter

flutter_native_splash:
  color: "#0a0011"
  image: assets/icons/splash.png
  ios: true
  android: true
  android_12:
    image: assets/icons/splash_alt.png
    icon_background_color: "#0a0011"
  fullscreen: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png"
  adaptive_icon_background: "#0a0011"
  adaptive_icon_foreground: "assets/icons/adaptive.png"
  macos:
    generate: true
    image_path: assets/icons/logo.png
  flavors:
    main:
      image_path: "assets/icons/logo.png"
      adaptive_icon_background: "#0a0011"
      adaptive_icon_foreground: "assets/icons/adaptive.png"
    dev:
      image_path: "assets/icons/logo.png"
      adaptive_icon_background: "#0a0011"
      adaptive_icon_foreground: "assets/icons/adaptive.png"

flutter:
  uses-material-design: true
  assets:
    - lib/l10n/
